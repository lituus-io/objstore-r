[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# Distribution `uu-objstore-r`, matching its siblings `uu-graph-r` and
# `uu-link-r`; the module this wheel ships is `objstore_r`.
name = "uu-objstore-r"
version = "0.3.0"
description = "One object-store API over Google Cloud Storage, a local directory and memory: generation preconditions (compare-and-swap), ranged reads, zero-copy buffers."
# abi3-py312 is the floor the Rust side builds against.
requires-python = ">=3.12"
readme = "README.md"
license = "AGPL-3.0-or-later OR LicenseRef-Proprietary"
authors = [{ name = "lituus-io", email = "support@lituus.io" }]
keywords = ["object-storage", "gcs", "google-cloud-storage", "compare-and-swap", "zero-copy"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Filesystems",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/lituus-io/objstore-r"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "objstore_r"
# objstore_r.pyi is packaged by maturin as the module's __init__.pyi, with a
# PEP 561 py.typed marker.
