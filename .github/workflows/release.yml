# Copyright: lituus-io, all rights reserved
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the GitHub Release job is granted write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # A mistagged release ships a wheel whose metadata lies about its version;
  # refuse before building anything.
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - name: Tag must match every manifest
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          for f in Cargo.toml bindings/python/Cargo.toml bindings/python/pyproject.toml; do
            grep -q "^version = \"$tag\"" "$f" \
              || { echo "::error::$f does not declare version $tag"; exit 1; }
          done

  verify:
    name: Verify crate
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo package --allow-dirty --no-verify --list
      # API compatibility against the previous release (skipped for the first
      # release, which has no baseline). The baseline is the published crate
      # on crates.io, not a git checkout of the tag: a checkout is extracted
      # under target/ where the ../graph-r path dependency does not resolve.
      - name: Semver check
        run: |
          # The newest earlier tag whose version is on crates.io: a tag can
          # exist without a published crate (0.4.0 reached PyPI only).
          prev=""
          for t in $(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$"); do
            if curl -sf -A "lituus-io-release" "https://crates.io/api/v1/crates/uu-objstore-r/${t#v}" >/dev/null; then
              prev="$t"; break
            fi
          done
          if [ -z "$prev" ]; then
            echo "first release: no baseline"
          elif ! git show "$prev:Cargo.toml" | grep -q '^name = "uu-objstore-r"'; then
            echo "baseline $prev predates the uu-objstore-r name: skipped"
          else
            RUSTUP_TOOLCHAIN=stable cargo install cargo-semver-checks --locked
            cargo semver-checks --baseline-version "${prev#v}" --all-features
          fi

  # One abi3 wheel per platform: the binding builds against the stable ABI
  # (abi3-py312), so a single artifact serves Python 3.12 and everything later.
  build-wheel:
    name: Wheel (${{ matrix.name }})
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds go through zig so the wheel links against
          # manylinux_2_28 glibc rather than the runner's (too-new) one.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin, args: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, args: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, args: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
          key: wheel-${{ matrix.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin (and zig for manylinux)
        shell: bash
        run: pip install maturin ziglang
      - name: Build wheel
        shell: bash
        working-directory: bindings/python
        run: maturin build --release --target ${{ matrix.target }} ${{ matrix.args }} --out dist
      - name: Smoke the wheel (host-native builds only)
        if: matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: bindings/python
        run: |
          python -m venv .smoke
          . .smoke/bin/activate 2>/dev/null || . .smoke/Scripts/activate
          pip install dist/*.whl pytest
          pytest tests/ -q
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  sdist:
    name: Source distribution
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - working-directory: bindings/python
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: bindings/python/dist/*.tar.gz

  release:
    name: GitHub Release
    needs: [verify, build-wheel, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # crates.io, with this crate's own scoped token. docs.rs builds the
  # documentation from the published crate ([package.metadata.docs.rs]).
  # A dependency released minutes earlier from a sibling repository may not
  # be in the index yet, so publishing retries for up to 20 minutes.
  publish-crate:
    name: Publish to crates.io
    needs: version-gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - run: rustup show
      - name: Publish uu-objstore-r
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN_UU_OBJSTORE_R }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if curl -sf -A "lituus-io-release" "https://crates.io/api/v1/crates/uu-objstore-r/$version" >/dev/null; then
            echo "uu-objstore-r $version is already on crates.io"
            exit 0
          fi
          for attempt in $(seq 1 20); do
            cargo publish && exit 0
            echo "attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1

  publish-pypi:
    name: Publish uu-objstore-r to PyPI
    needs: [verify, build-wheel, sdist]
    runs-on: ubuntu-latest
    # Tag-gated for real releases (pre-release tags with a '-' are not
    # published); also runnable by hand to retry a publish-side failure.
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PACKAGE }}
        run: |
          pip install twine
          twine check dist/*
          twine upload --verbose --skip-existing dist/*
