[package]
name = "objstore-r-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
objstore-r = { package = "uu-objstore-r", path = "..", features = ["gcs", "mirror", "gzip"] }

[[bin]]
name = "fuzz_key"
path = "fuzz_targets/fuzz_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gcs_wire"
path = "fuzz_targets/fuzz_gcs_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mirror_manifest"
path = "fuzz_targets/fuzz_mirror_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_encoding"
path = "fuzz_targets/fuzz_encoding.rs"
test = false
doc = false
bench = false

# Detached from the parent workspace on purpose (mirrors graph-r and link-r).
[workspace]
members = ["."]
